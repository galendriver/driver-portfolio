<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Driver Portfolio</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Portfolio" />
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#0d1117" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --bg-card:   #161b22;
      --bg-tab:    #1c2128;
      --border:    #30363d;
      --text:      #e6edf3;
      --text-sub:  #8b949e;
      --text-muted:#6e7681;
      --green:     #3fb950;
      --red:       #f85149;
      --blue:      #58a6ff;
      --radius:    12px;
      --safe-top:  env(safe-area-inset-top,  0px);
      --safe-bot:  env(safe-area-inset-bottom, 0px);
      --safe-l:    env(safe-area-inset-left,  0px);
      --safe-r:    env(safe-area-inset-right, 0px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    #header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 12px) calc(var(--safe-r) + 16px) 12px calc(var(--safe-l) + 16px);
      display: flex; align-items: center; gap: 10px;
    }
    #header h1 { font-size: 17px; font-weight: 700; white-space: nowrap; }
    #updated-label {
      flex: 1; font-size: 12px; color: var(--text-muted);
      text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #refresh-btn {
      background: none; border: 1px solid var(--border); color: var(--text-sub);
      border-radius: 8px; padding: 6px 10px; font-size: 16px; cursor: pointer; line-height: 1;
      flex-shrink: 0;
    }
    #refresh-btn:active { color: var(--blue); border-color: var(--blue); }
    #refresh-btn.spinning { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Main ── */
    #main {
      padding: 16px calc(var(--safe-r) + 16px) calc(var(--safe-bot) + 32px) calc(var(--safe-l) + 16px);
      max-width: 600px; margin: 0 auto;
    }

    /* ── Summary cards ── */
    #summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .card-total { grid-column: 1 / -1; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
    }
    .card-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .8px; color: var(--text-muted); margin-bottom: 4px;
    }
    .card-value { font-size: 28px; font-weight: 700; letter-spacing: -.5px; line-height: 1.1; }
    .card-total .card-value { font-size: 34px; }
    .card-gains { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
    .card-gain-line { font-size: 13px; font-weight: 500; }
    .card-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* ── Owner tabs ── */
    #tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab {
      flex: 1; background: var(--bg-tab); border: 1px solid var(--border);
      color: var(--text-sub); border-radius: 8px; padding: 8px 0;
      font-size: 14px; font-weight: 500; cursor: pointer; text-align: center;
    }
    .tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    /* ── Controls bar (sort + view) ── */
    #controls {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; flex-wrap: wrap;
    }
    .ctrl-group { display: flex; gap: 4px; }
    .ctrl-label { font-size: 12px; color: var(--text-muted); align-self: center; margin-right: 2px; }
    .ctrl-btn {
      background: var(--bg-tab); border: 1px solid var(--border);
      color: var(--text-sub); border-radius: 7px; padding: 5px 10px;
      font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
    }
    .ctrl-btn.active { background: var(--bg-card); border-color: var(--text-sub); color: var(--text); }
    .ctrl-spacer { flex: 1; }
    .ctrl-toggle {
      background: var(--bg-tab); border: 1px solid var(--border);
      color: var(--text-sub); border-radius: 7px; padding: 5px 12px;
      font-size: 12px; font-weight: 500; cursor: pointer;
    }
    .ctrl-toggle.active { border-color: var(--blue); color: var(--blue); }

    /* ── Group sections ── */
    .group { margin-bottom: 10px; }
    .group-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; cursor: pointer; user-select: none;
      background: var(--bg-tab); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .group-chevron { font-size: 11px; color: var(--text-muted); flex-shrink: 0; transition: transform .2s; }
    .group.collapsed .group-chevron { transform: rotate(-90deg); }
    .group-name { font-size: 14px; font-weight: 700; flex: 1; }
    .group-meta { text-align: right; }
    .group-total { font-size: 14px; font-weight: 700; }
    .group-ytd { font-size: 12px; font-weight: 500; margin-top: 1px; }
    .group-rows { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
    .group.collapsed .group-rows { display: none; }

    /* ── Position rows ── */
    .position-row {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 11px 14px;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .pos-left { flex: 1; min-width: 0; }
    .pos-ticker { font-size: 15px; font-weight: 700; }
    .pos-desc { font-size: 12px; color: var(--text-sub); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pos-detail { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .pos-accounts { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .pos-gains { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
    .pos-gain-chip {
      font-size: 11px; font-weight: 600; padding: 2px 7px;
      border-radius: 20px; background: var(--bg-tab); border: 1px solid var(--border);
      white-space: nowrap;
    }
    .pos-right { text-align: right; flex-shrink: 0; }
    .pos-value { font-size: 16px; font-weight: 700; }
    .pos-source { font-size: 11px; font-weight: 500; margin-top: 2px; }
    .pos-owner {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      color: var(--text-muted); background: var(--bg-tab);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 1px 5px; display: inline-block; margin-top: 4px;
    }

    /* ── Color helpers ── */
    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .muted { color: var(--text-muted); }
    .source-live   { color: var(--green); }
    .source-manual { color: var(--text-muted); }

    /* ── Loading / error ── */
    #status-msg { text-align: center; padding: 48px 16px; color: var(--text-muted); }
    .spinner {
      display: inline-block; width: 24px; height: 24px;
      border: 2px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 12px;
    }
    #error-msg {
      background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.4);
      border-radius: var(--radius); padding: 14px 16px; color: var(--red);
      font-size: 13px; margin-bottom: 14px; display: none;
    }
  </style>
</head>
<body>

<header id="header">
  <h1>Driver Portfolio</h1>
  <span id="updated-label">Loading…</span>
  <button id="refresh-btn" title="Refresh">↻</button>
</header>

<main id="main">
  <div id="error-msg"></div>

  <!-- Summary cards -->
  <section id="summary">
    <div class="card card-total">
      <div class="card-label">Total Portfolio</div>
      <div class="card-value" id="val-total">—</div>
      <div class="card-gains" id="gains-total"></div>
      <div class="card-sub" id="val-liquid"></div>
    </div>
    <div class="card">
      <div class="card-label">Galen</div>
      <div class="card-value" id="val-galen">—</div>
      <div class="card-gains" id="gains-galen"></div>
    </div>
    <div class="card">
      <div class="card-label">Jaclyn</div>
      <div class="card-value" id="val-jaclyn">—</div>
      <div class="card-gains" id="gains-jaclyn"></div>
    </div>
  </section>

  <!-- Owner filter tabs -->
  <div id="tabs">
    <button class="tab active" data-filter="all">All</button>
    <button class="tab" data-filter="galen">Galen</button>
    <button class="tab" data-filter="jaclyn">Jaclyn</button>
  </div>

  <!-- Sort + view controls -->
  <div id="controls">
    <span class="ctrl-label">Sort:</span>
    <div class="ctrl-group">
      <button class="ctrl-btn active" data-sort="value-desc">Value ▼</button>
      <button class="ctrl-btn" data-sort="value-asc">Value ▲</button>
      <button class="ctrl-btn" data-sort="alpha">A→Z</button>
      <button class="ctrl-btn" data-sort="ytd">YTD%</button>
    </div>
    <div class="ctrl-spacer"></div>
    <button class="ctrl-toggle" id="combine-btn">Combine</button>
  </div>

  <div id="status-msg"><div class="spinner"></div><br>Fetching live prices…</div>
  <div id="groups-container"></div>
</main>

<script>
  // ── Config ───────────────────────────────────────────────
  const GROUP_ORDER  = ['us_equity','crypto','retirement','private_equity','cash'];
  const GROUP_LABELS = {
    us_equity: 'Stocks', crypto: 'Crypto', retirement: 'Retirement',
    private_equity: 'Private Equity', cash: 'Cash',
  };

  // ── State ────────────────────────────────────────────────
  let allPositions    = [];
  let currentFilter   = 'all';
  let currentSort     = 'value-desc';
  let combinedView    = false;
  let collapsedGroups = new Set();
  let refreshTimer    = null;

  // ── Formatters ───────────────────────────────────────────
  function fmt(n) {
    if (n == null) return '—';
    const abs = Math.abs(n);
    if (abs >= 1_000_000) return '$' + (n / 1_000_000).toFixed(2) + 'M';
    if (abs >= 1_000)     return '$' + Math.round(n).toLocaleString('en-US');
    return '$' + n.toFixed(2);
  }
  function fmtFull(n) {
    return n == null ? '—' : '$' + Math.round(n).toLocaleString('en-US');
  }
  function fmtShares(s) {
    if (s == null) return null;
    return s >= 10
      ? s.toLocaleString('en-US', { maximumFractionDigits: 2 })
      : s.toLocaleString('en-US', { maximumFractionDigits: 6 });
  }
  function fmtPrice(p) {
    if (p == null) return null;
    if (p >= 1000) return '$' + p.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (p >= 1)    return '$' + p.toFixed(2);
    return '$' + p.toFixed(4);
  }
  function fmtGainChip(gain, pct, label) {
    if (gain == null) return null;
    const sign = gain >= 0 ? '+' : '';
    const cls  = gain >= 0 ? 'pos' : 'neg';
    const ps   = pct != null ? ` (${sign}${pct.toFixed(1)}%)` : '';
    return `<span class="pos-gain-chip ${cls}">${label}: ${sign}${fmt(gain)}${ps}</span>`;
  }
  function fmtGainLine(gain, pct, label) {
    if (gain == null) return '';
    const sign = gain >= 0 ? '+' : '';
    const cls  = gain >= 0 ? 'pos' : 'neg';
    const ps   = pct != null ? ` (${sign}${pct.toFixed(1)}%)` : '';
    return `<div class="card-gain-line ${cls}">${label}: ${sign}${fmt(gain)}${ps}</div>`;
  }
  function srcLabel(s) {
    if (!s || s === 'missing') return 'no price';
    if (s === 'manual-fallback') return 'est.';
    if (s === 'manual') return 'manual';
    if (s === 'zero')   return '—';
    return 'live';
  }
  function srcClass(s) {
    if (!s || s === 'missing') return 'muted';
    if (s.startsWith('manual')) return 'source-manual';
    return 'source-live';
  }

  // ── Sort helper ──────────────────────────────────────────
  function sortRows(rows) {
    return [...rows].sort((a, b) => {
      if (currentSort === 'value-desc') return b.value - a.value;
      if (currentSort === 'value-asc')  return a.value - b.value;
      if (currentSort === 'alpha')      return a.ticker.localeCompare(b.ticker);
      if (currentSort === 'ytd') {
        const ap = a.ytd_pct ?? -Infinity;
        const bp = b.ytd_pct ?? -Infinity;
        return bp - ap;
      }
      return 0;
    });
  }

  // ── Combine positions by underlying symbol ────────────────
  function combinePositions(rows) {
    const map = new Map();
    rows.forEach(p => {
      const key = p.symbol || p.ticker;
      if (!map.has(key)) {
        map.set(key, { ...p, _accounts: [p.account], _count: 1 });
      } else {
        const m = map.get(key);
        m.value += p.value;
        if (p.shares != null) m.shares = (m.shares || 0) + p.shares;
        if (p.ytd_gain != null && m.ytd_gain != null) {
          m.ytd_gain += p.ytd_gain;
          if (p.ytd_start_value != null && m.ytd_start_value != null) {
            m.ytd_start_value += p.ytd_start_value;
            m.ytd_pct = m.ytd_start_value
              ? m.ytd_gain / m.ytd_start_value * 100 : null;
          }
        } else if (p.ytd_gain != null) {
          m.ytd_gain = p.ytd_gain;
          m.ytd_pct  = p.ytd_pct;
        }
        if (p.alltime_gain != null && m.alltime_gain != null) {
          m.alltime_gain += p.alltime_gain;
          if (p.cost_basis != null && m.cost_basis != null) {
            m.cost_basis += p.cost_basis;
            m.alltime_pct = m.cost_basis
              ? m.alltime_gain / m.cost_basis * 100 : null;
          }
        } else if (p.alltime_gain != null) {
          m.alltime_gain = p.alltime_gain;
          m.alltime_pct  = p.alltime_pct;
        }
        m._accounts.push(p.account);
        m._count++;
      }
    });
    return Array.from(map.values());
  }

  // ── Fetch data ───────────────────────────────────────────
  async function fetchPortfolio() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    document.getElementById('error-msg').style.display = 'none';

    try {
      const res  = await fetch('/api/portfolio');
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

      allPositions = data.positions;
      const s = data.summary;

      document.getElementById('val-total').textContent  = fmtFull(s.total_portfolio);
      document.getElementById('val-galen').textContent  = fmtFull(s.galen_total);
      document.getElementById('val-jaclyn').textContent = fmtFull(s.jaclyn_total);
      document.getElementById('val-liquid').textContent = 'Liquid: ' + fmtFull(s.liquid_total);

      document.getElementById('gains-total').innerHTML =
        fmtGainLine(s.portfolio_ytd_gain, s.portfolio_ytd_pct, 'YTD') +
        fmtGainLine(s.portfolio_alltime_gain, s.portfolio_alltime_pct, 'All-time');
      document.getElementById('gains-galen').innerHTML =
        fmtGainLine(s.galen_ytd_gain, s.galen_ytd_pct, 'YTD') +
        fmtGainLine(s.galen_alltime_gain, s.galen_alltime_pct, 'All-time');
      document.getElementById('gains-jaclyn').innerHTML =
        fmtGainLine(s.jaclyn_ytd_gain, s.jaclyn_ytd_pct, 'YTD') +
        fmtGainLine(s.jaclyn_alltime_gain, s.jaclyn_alltime_pct, 'All-time');

      const timePart = (data.last_updated || '').split(' ')[1] || data.last_updated;
      document.getElementById('updated-label').textContent = 'Updated ' + timePart;

      document.getElementById('status-msg').style.display = 'none';
      renderGroups();

    } catch (err) {
      const el = document.getElementById('error-msg');
      el.textContent = 'Failed to load: ' + err.message;
      el.style.display = 'block';
      document.getElementById('status-msg').style.display = 'none';
      if (allPositions.length) renderGroups();
    } finally {
      btn.classList.remove('spinning');
      scheduleRefresh();
    }
  }

  // ── Render groups ────────────────────────────────────────
  function renderGroups() {
    // Filter by owner
    let filtered = allPositions.filter(p =>
      currentFilter === 'all' || p.owner === currentFilter
    );

    // Optionally combine by underlying symbol
    if (combinedView) filtered = combinePositions(filtered);

    // Group by asset class
    const groups = {};
    filtered.forEach(p => {
      const key = p.asset_class || 'other';
      if (!groups[key]) groups[key] = [];
      groups[key].push(p);
    });

    const container = document.getElementById('groups-container');
    container.innerHTML = '';

    const order = [...GROUP_ORDER, ...Object.keys(groups).filter(k => !GROUP_ORDER.includes(k))];

    order.forEach(key => {
      const rows = groups[key];
      if (!rows || rows.length === 0) return;

      const sorted     = sortRows(rows);
      const label      = GROUP_LABELS[key] || key;
      const groupTotal = rows.reduce((s, p) => s + p.value, 0);
      const isCollapsed = collapsedGroups.has(key);

      // Group YTD
      let ytdStart = 0, ytdCur = 0, hasYtd = false;
      rows.forEach(p => {
        if (p.ytd_start_value != null) { ytdStart += p.ytd_start_value; ytdCur += p.value; hasYtd = true; }
      });
      let ytdHtml = '';
      if (hasYtd && ytdStart) {
        const gain = ytdCur - ytdStart;
        const pct  = gain / ytdStart * 100;
        const sign = gain >= 0 ? '+' : '';
        const cls  = gain >= 0 ? 'pos' : 'neg';
        ytdHtml = `<div class="group-ytd ${cls}">YTD ${sign}${pct.toFixed(1)}%</div>`;
      }

      // Position rows HTML
      const rowsHtml = sorted.map(p => {
        let detail = '';
        if (p.shares != null && p.price != null) {
          detail = `${fmtShares(p.shares)} sh @ ${fmtPrice(p.price)}`;
        } else if (p.shares != null) {
          detail = `${fmtShares(p.shares)} sh`;
        }

        // In combined mode, show which accounts are included
        let accountsHtml = '';
        if (combinedView && p._count > 1) {
          const accts = p._accounts.map(a => a.replace(/_/g, ' ')).join(' · ');
          accountsHtml = `<div class="pos-accounts">${accts}</div>`;
        }

        const chips = [
          fmtGainChip(p.ytd_gain, p.ytd_pct, 'YTD'),
          fmtGainChip(p.alltime_gain, p.alltime_pct, 'All-time'),
        ].filter(Boolean).join('');

        const ownerBadge = (currentFilter === 'all' && !combinedView)
          ? `<span class="pos-owner">${p.owner}</span>` : '';

        return `
          <div class="position-row">
            <div class="pos-left">
              <div class="pos-ticker">${p.ticker}</div>
              <div class="pos-desc">${p.description}</div>
              ${detail       ? `<div class="pos-detail">${detail}</div>` : ''}
              ${accountsHtml}
              ${chips        ? `<div class="pos-gains">${chips}</div>` : ''}
              ${ownerBadge}
            </div>
            <div class="pos-right">
              <div class="pos-value">${fmt(p.value)}</div>
              <div class="pos-source ${srcClass(p.price_source)}">${srcLabel(p.price_source)}</div>
            </div>
          </div>`;
      }).join('');

      const groupEl = document.createElement('div');
      groupEl.className = 'group' + (isCollapsed ? ' collapsed' : '');
      groupEl.dataset.key = key;
      groupEl.innerHTML = `
        <div class="group-header">
          <span class="group-chevron">▼</span>
          <span class="group-name">${label}</span>
          <div class="group-meta">
            <div class="group-total">${fmtFull(groupTotal)}</div>
            ${ytdHtml}
          </div>
        </div>
        <div class="group-rows">${rowsHtml}</div>
      `;

      groupEl.querySelector('.group-header').addEventListener('click', () => {
        const k = groupEl.dataset.key;
        collapsedGroups.has(k) ? collapsedGroups.delete(k) : collapsedGroups.add(k);
        groupEl.classList.toggle('collapsed');
      });

      container.appendChild(groupEl);
    });
  }

  // ── Auto-refresh ─────────────────────────────────────────
  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(fetchPortfolio, 5 * 60 * 1000);
  }

  // ── Events ───────────────────────────────────────────────
  document.getElementById('refresh-btn').addEventListener('click', () => {
    clearTimeout(refreshTimer);
    fetchPortfolio();
  });

  document.getElementById('tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderGroups();
  });

  document.getElementById('controls').addEventListener('click', e => {
    const btn = e.target.closest('.ctrl-btn');
    if (btn) {
      document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSort = btn.dataset.sort;
      renderGroups();
    }
  });

  document.getElementById('combine-btn').addEventListener('click', () => {
    combinedView = !combinedView;
    document.getElementById('combine-btn').classList.toggle('active', combinedView);
    renderGroups();
  });

  // ── Boot ─────────────────────────────────────────────────
  fetchPortfolio();
</script>
</body>
</html>
