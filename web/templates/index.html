<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Driver Portfolio</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Portfolio" />
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#0d1117" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --bg-card:   #161b22;
      --bg-tab:    #1c2128;
      --border:    #30363d;
      --text:      #e6edf3;
      --text-sub:  #8b949e;
      --text-muted:#6e7681;
      --green:     #3fb950;
      --red:       #f85149;
      --blue:      #58a6ff;
      --radius:    12px;
      --safe-top:  env(safe-area-inset-top,  0px);
      --safe-bot:  env(safe-area-inset-bottom, 0px);
      --safe-l:    env(safe-area-inset-left,  0px);
      --safe-r:    env(safe-area-inset-right, 0px);
      --nav-h:     56px;
    }

    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 12px) calc(var(--safe-r) + 16px) 12px calc(var(--safe-l) + 16px);
      display: flex; align-items: center; gap: 10px;
    }
    #header h1 { font-size: 17px; font-weight: 700; white-space: nowrap; }
    #header-center { flex: 1; text-align: center; }
    #updated-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #page-title { font-size: 15px; font-weight: 600; display: none; }
    #refresh-btn {
      background: none; border: 1px solid var(--border); color: var(--text-sub);
      border-radius: 8px; padding: 6px 10px; font-size: 16px; cursor: pointer; line-height: 1; flex-shrink: 0;
    }
    #refresh-btn:active { color: var(--blue); border-color: var(--blue); }
    #refresh-btn.spinning { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Bottom Nav ── */
    #nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: var(--bg-card); border-top: 1px solid var(--border);
      display: flex; padding-bottom: var(--safe-bot);
    }
    .nav-btn {
      flex: 1; padding: 8px 0 6px; text-align: center;
      background: none; border: none; cursor: pointer; color: var(--text-muted);
      font-size: 10px; font-weight: 600; display: flex; flex-direction: column;
      align-items: center; gap: 3px; letter-spacing: .3px; text-transform: uppercase;
    }
    .nav-icon { font-size: 22px; line-height: 1.2; }
    .nav-btn.active { color: var(--blue); }

    /* ── Pages ── */
    .page {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding-top: calc(var(--safe-top) + 56px);
      padding-bottom: calc(var(--nav-h) + var(--safe-bot) + 16px);
    }
    .page.hidden { display: none !important; }

    /* ── Portfolio page inner ── */
    #page-portfolio .inner {
      padding: 16px calc(var(--safe-r) + 16px) 0 calc(var(--safe-l) + 16px);
      max-width: 600px; margin: 0 auto;
    }

    /* ── Summary card ── */
    #summary { margin-bottom: 16px; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px;
    }
    .card-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .8px; color: var(--text-muted); margin-bottom: 4px;
    }
    .card-value { font-size: 36px; font-weight: 700; letter-spacing: -.5px; line-height: 1.1; }
    .card-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .perf-row {
      display: flex; gap: 0; margin-top: 14px;
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    }
    .perf-cell { flex: 1; padding: 10px 12px; text-align: center; border-right: 1px solid var(--border); }
    .perf-cell:last-child { border-right: none; }
    .perf-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); margin-bottom: 3px; }
    .perf-val   { font-size: 15px; font-weight: 700; }
    .perf-pct   { font-size: 12px; font-weight: 500; margin-top: 1px; }

    /* ── Controls ── */
    #controls {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; flex-wrap: wrap;
    }
    .ctrl-group { display: flex; gap: 4px; }
    .ctrl-label { font-size: 12px; color: var(--text-muted); align-self: center; margin-right: 2px; }
    .ctrl-btn {
      background: var(--bg-tab); border: 1px solid var(--border);
      color: var(--text-sub); border-radius: 7px; padding: 5px 10px;
      font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
    }
    .ctrl-btn.active { background: var(--bg-card); border-color: var(--text-sub); color: var(--text); }
    .ctrl-spacer { flex: 1; }
    .ctrl-toggle {
      background: var(--bg-tab); border: 1px solid var(--border);
      color: var(--text-sub); border-radius: 7px; padding: 5px 12px;
      font-size: 12px; font-weight: 500; cursor: pointer;
    }
    .ctrl-toggle.active { border-color: var(--blue); color: var(--blue); }

    /* ── Groups ── */
    .group { margin-bottom: 10px; }
    .group-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; cursor: pointer; user-select: none;
      background: var(--bg-tab); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .group-chevron { font-size: 11px; color: var(--text-muted); flex-shrink: 0; transition: transform .2s; }
    .group.collapsed .group-chevron { transform: rotate(-90deg); }
    .group-name { font-size: 14px; font-weight: 700; flex: 1; }
    .group-meta { text-align: right; }
    .group-total { font-size: 14px; font-weight: 700; }
    .group-perf { font-size: 12px; font-weight: 500; margin-top: 1px; }
    .group-rows { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
    .group.collapsed .group-rows { display: none; }

    /* ── Position rows ── */
    .position-row {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 11px 14px;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .pos-left { flex: 1; min-width: 0; }
    .pos-ticker { font-size: 15px; font-weight: 700; }
    .pos-desc { font-size: 12px; color: var(--text-sub); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pos-detail { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .pos-accounts { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .pos-gains { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
    .pos-gain-chip {
      font-size: 11px; font-weight: 600; padding: 2px 7px;
      border-radius: 20px; background: var(--bg-tab); border: 1px solid var(--border); white-space: nowrap;
    }
    .pos-right { text-align: right; flex-shrink: 0; }
    .pos-value { font-size: 16px; font-weight: 700; }
    .pos-source { font-size: 11px; font-weight: 500; margin-top: 2px; }

    /* ── Color helpers ── */
    .pos { color: var(--green); } .neg { color: var(--red); } .muted { color: var(--text-muted); }
    .source-live { color: var(--green); } .source-manual { color: var(--text-muted); }

    /* ── Unvested RSU section ── */
    #unvested-section { margin-top: 16px; }
    .unvested-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; cursor: pointer; user-select: none;
      background: var(--bg-tab); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .unvested-chevron { font-size: 11px; color: var(--text-muted); flex-shrink: 0; transition: transform .2s; }
    #unvested-section.collapsed .unvested-chevron { transform: rotate(-90deg); }
    .unvested-title { font-size: 14px; font-weight: 700; flex: 1; }
    .unvested-meta { text-align: right; }
    .unvested-meta-total { font-size: 14px; font-weight: 700; }
    .unvested-meta-perf { font-size: 12px; font-weight: 500; margin-top: 1px; }
    .unvested-rows { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
    #unvested-section.collapsed .unvested-rows { display: none; }
    .unvested-row {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 11px 14px;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .unvested-note { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-style: italic; }
    .unvested-total-row {
      background: var(--bg-card); border: 1px solid var(--border);
      border-top: 1px solid var(--text-muted);
      border-radius: var(--radius); padding: 11px 14px;
      display: flex; align-items: flex-start; gap: 10px; margin-top: 2px;
    }

    /* ── Baseline card ── */
    #baseline-card {
      margin-top: 16px;
      background: var(--bg-tab); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px;
    }
    .baseline-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .8px; color: var(--text-muted); margin-bottom: 6px;
    }
    .baseline-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
    .baseline-key { font-size: 13px; color: var(--text-sub); }
    .baseline-val { font-size: 15px; font-weight: 700; }

    /* ── Loading / error ── */
    #status-msg { text-align: center; padding: 48px 16px; color: var(--text-muted); }
    .spinner {
      display: inline-block; width: 24px; height: 24px;
      border: 2px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 12px;
    }
    #error-msg {
      background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.4);
      border-radius: var(--radius); padding: 14px 16px; color: var(--red);
      font-size: 13px; margin-bottom: 14px; display: none;
    }

    /* ── Actions page ── */
    #page-actions .inner {
      padding: 16px calc(var(--safe-r) + 16px) 0 calc(var(--safe-l) + 16px);
      max-width: 680px; margin: 0 auto;
    }
    #actions-content { font-size: 14px; }
    #actions-content h2 {
      font-size: 15px; font-weight: 700; color: var(--text);
      margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }
    #actions-content h2:first-child { margin-top: 0; }
    #actions-content h3 { font-size: 13px; font-weight: 600; color: var(--text-sub); margin: 14px 0 6px; }
    #actions-content table {
      width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0;
    }
    #actions-content th {
      background: var(--bg-tab); color: var(--text-sub); font-size: 11px;
      font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
      padding: 7px 10px; text-align: left; border: 1px solid var(--border);
    }
    #actions-content td {
      padding: 7px 10px; border: 1px solid var(--border);
      color: var(--text); vertical-align: top; line-height: 1.4;
    }
    #actions-content tr:nth-child(even) td { background: rgba(255,255,255,.02); }
    #actions-content p { color: var(--text-sub); margin: 6px 0; }
    #actions-content ul, #actions-content ol { padding-left: 18px; margin: 6px 0; }
    #actions-content li { color: var(--text-sub); margin: 3px 0; }
    #actions-content strong { color: var(--text); }
    #actions-content code {
      background: var(--bg-tab); border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 5px; font-size: 12px; font-family: monospace;
    }
    #actions-loading { text-align: center; padding: 48px 16px; color: var(--text-muted); }

  </style>
</head>
<body>

<header id="header">
  <h1>Driver Portfolio</h1>
  <div id="header-center">
    <span id="updated-label">Loading…</span>
    <span id="page-title"></span>
  </div>
  <button id="refresh-btn" title="Refresh">↻</button>
</header>

<!-- Portfolio Page -->
<div id="page-portfolio" class="page">
  <div class="inner">
    <div id="error-msg"></div>

    <section id="summary">
      <div class="card">
        <div class="card-label">Total Portfolio</div>
        <div class="card-value" id="val-total">—</div>
        <div class="card-sub" id="val-liquid"></div>
        <div class="perf-row">
          <div class="perf-cell">
            <div class="perf-label">1D</div>
            <div class="perf-val" id="perf-day-val">—</div>
            <div class="perf-pct" id="perf-day-pct"></div>
          </div>
          <div class="perf-cell">
            <div class="perf-label">1W</div>
            <div class="perf-val" id="perf-week-val">—</div>
            <div class="perf-pct" id="perf-week-pct"></div>
          </div>
          <div class="perf-cell">
            <div class="perf-label">YTD</div>
            <div class="perf-val" id="perf-ytd-val">—</div>
            <div class="perf-pct" id="perf-ytd-pct"></div>
          </div>
        </div>
      </div>
    </section>

    <div id="controls">
      <span class="ctrl-label">Sort:</span>
      <div class="ctrl-group">
        <button class="ctrl-btn active" data-sort="value-desc">Value ▼</button>
        <button class="ctrl-btn" data-sort="value-asc">Value ▲</button>
        <button class="ctrl-btn" data-sort="alpha">A→Z</button>
        <button class="ctrl-btn" data-sort="day">1D%</button>
        <button class="ctrl-btn" data-sort="week">1W%</button>
        <button class="ctrl-btn" data-sort="ytd">YTD%</button>
      </div>
      <div class="ctrl-spacer"></div>
      <button class="ctrl-toggle" id="combine-btn">Combine</button>
    </div>

    <div id="status-msg"><div class="spinner"></div><br>Fetching live prices…</div>
    <div id="groups-container"></div>

    <div id="unvested-section" style="display:none">
      <div class="unvested-header" id="unvested-header">
        <span class="unvested-chevron">▼</span>
        <span class="unvested-title">Unvested RSUs</span>
        <div class="unvested-meta">
          <div class="unvested-meta-total" id="unvested-total">—</div>
          <div class="unvested-meta-perf" id="unvested-perf"></div>
        </div>
      </div>
      <div class="unvested-rows" id="unvested-rows"></div>
    </div>

    <div id="baseline-card" style="display:none">
      <div class="baseline-label">Original Holdings — Pre-reallocation baseline (Mar 11)</div>
      <div class="baseline-row">
        <span class="baseline-key">Real-time value</span>
        <span class="baseline-val" id="baseline-total">—</span>
      </div>
      <div class="baseline-row">
        <span class="baseline-key">YTD change</span>
        <span class="baseline-val" id="baseline-ytd">—</span>
      </div>
    </div>
  </div>
</div>

<!-- Actions Page -->
<div id="page-actions" class="page hidden">
  <div class="inner">
    <div id="actions-loading"><div class="spinner"></div><br>Loading action items…</div>
    <div id="actions-content"></div>
  </div>
</div>

<!-- Bottom Nav -->
<nav id="nav-bar">
  <button class="nav-btn active" data-page="portfolio">
    <span class="nav-icon">📊</span>
    <span>Portfolio</span>
  </button>
  <button class="nav-btn" data-page="actions">
    <span class="nav-icon">✅</span>
    <span>Actions</span>
  </button>
</nav>

<script>
  // ── Config ──────────────────────────────────────────────────
  const GROUP_ORDER  = ['us_equity','crypto','retirement','private_equity','cash'];
  const GROUP_LABELS = {
    us_equity: 'Stocks', crypto: 'Crypto', retirement: 'Retirement',
    private_equity: 'Private Equity', cash: 'Cash',
  };

  // ── State ────────────────────────────────────────────────────
  let allPositions    = [];
  let currentSort     = 'value-desc';
  let combinedView    = false;
  let collapsedGroups = new Set();
  let unvestedCollapsed = false;
  let refreshTimer    = null;
  let activePage      = 'portfolio';
  let actionsLoaded   = false;

  // ── Formatters ───────────────────────────────────────────────
  function fmt(n) {
    if (n == null) return '—';
    const abs = Math.abs(n);
    if (abs >= 1_000_000) return '$' + (n / 1_000_000).toFixed(2) + 'M';
    if (abs >= 1_000)     return '$' + Math.round(n).toLocaleString('en-US');
    return '$' + n.toFixed(2);
  }
  function fmtFull(n) {
    return n == null ? '—' : '$' + Math.round(n).toLocaleString('en-US');
  }
  function fmtShares(s) {
    if (s == null) return null;
    return s >= 10
      ? s.toLocaleString('en-US', { maximumFractionDigits: 2 })
      : s.toLocaleString('en-US', { maximumFractionDigits: 6 });
  }
  function fmtPrice(p) {
    if (p == null) return null;
    if (p >= 1000) return '$' + p.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (p >= 1)    return '$' + p.toFixed(2);
    return '$' + p.toFixed(4);
  }
  function fmtGainChip(gain, pct, label) {
    if (gain == null) return null;
    const sign = gain >= 0 ? '+' : '';
    const cls  = gain >= 0 ? 'pos' : 'neg';
    const ps   = pct != null ? ` (${sign}${pct.toFixed(1)}%)` : '';
    return `<span class="pos-gain-chip ${cls}">${label}: ${sign}${fmt(gain)}${ps}</span>`;
  }
  function fillPerfCell(valEl, pctEl, gain, pct) {
    if (gain == null) { valEl.textContent = '—'; pctEl.textContent = ''; return; }
    const sign = gain >= 0 ? '+' : '';
    const cls  = gain >= 0 ? 'pos' : 'neg';
    valEl.textContent = sign + fmt(gain);
    valEl.className   = 'perf-val ' + cls;
    if (pct != null) {
      pctEl.textContent = sign + pct.toFixed(2) + '%';
      pctEl.className   = 'perf-pct ' + cls;
    }
  }
  function srcLabel(s) {
    if (!s || s === 'missing') return 'no price';
    if (s === 'manual-fallback') return 'est.';
    if (s === 'manual') return 'manual';
    if (s === 'zero')   return '—';
    return 'live';
  }
  function srcClass(s) {
    if (!s || s === 'missing') return 'muted';
    if (s.startsWith('manual')) return 'source-manual';
    return 'source-live';
  }

  // ── Sort ─────────────────────────────────────────────────────
  function sortRows(rows) {
    return [...rows].sort((a, b) => {
      if (currentSort === 'value-desc') return b.value - a.value;
      if (currentSort === 'value-asc')  return a.value - b.value;
      if (currentSort === 'alpha')      return a.ticker.localeCompare(b.ticker);
      if (currentSort === 'day')  { const ap = a.day_pct  ?? -Infinity, bp = b.day_pct  ?? -Infinity; return bp - ap; }
      if (currentSort === 'week') { const ap = a.week_pct ?? -Infinity, bp = b.week_pct ?? -Infinity; return bp - ap; }
      if (currentSort === 'ytd')  { const ap = a.ytd_pct  ?? -Infinity, bp = b.ytd_pct  ?? -Infinity; return bp - ap; }
      return 0;
    });
  }

  // ── Combine ───────────────────────────────────────────────────
  function combinePositions(rows) {
    const map = new Map();
    rows.forEach(p => {
      const key = p.symbol || p.ticker;
      if (!map.has(key)) {
        map.set(key, { ...p, _accounts: [p.account], _count: 1 });
      } else {
        const m = map.get(key);
        m.value += p.value;
        if (p.shares != null) m.shares = (m.shares || 0) + p.shares;
        for (const [gainKey, startKey, pctKey] of [
          ['day_gain',  null,             'day_pct'],
          ['week_gain', null,             'week_pct'],
          ['ytd_gain',  'ytd_start_value','ytd_pct'],
        ]) {
          if (p[gainKey] != null && m[gainKey] != null) {
            m[gainKey] += p[gainKey];
            if (startKey && p[startKey] != null && m[startKey] != null) {
              m[startKey] += p[startKey];
              m[pctKey] = m[startKey] ? m[gainKey] / m[startKey] * 100 : null;
            }
          } else if (p[gainKey] != null) {
            m[gainKey] = p[gainKey];
            m[pctKey]  = p[pctKey];
          }
        }
        if (p.alltime_gain != null && m.alltime_gain != null) {
          m.alltime_gain += p.alltime_gain;
          if (p.cost_basis != null && m.cost_basis != null) {
            m.cost_basis += p.cost_basis;
            m.alltime_pct = m.cost_basis ? m.alltime_gain / m.cost_basis * 100 : null;
          }
        } else if (p.alltime_gain != null) {
          m.alltime_gain = p.alltime_gain;
          m.alltime_pct  = p.alltime_pct;
        }
        m._accounts.push(p.account);
        m._count++;
      }
    });
    return Array.from(map.values());
  }

  // ── Render unvested RSUs ─────────────────────────────────────
  function renderUnvested(unvested) {
    const section = document.getElementById('unvested-section');
    if (!unvested || unvested.length === 0) { section.style.display = 'none'; return; }

    const totalGross = unvested.reduce((s, p) => s + p.value, 0);

    // Aggregate gains for live perf display
    let dayGain = null, dayStart = 0;
    let weekGain = null, weekStart = 0;
    let ytdGain = null, ytdStart = 0;
    unvested.forEach(p => {
      if (p.day_gain != null) {
        dayGain = (dayGain ?? 0) + p.day_gain;
        dayStart += p.value - p.day_gain;
      }
      if (p.week_gain != null) {
        weekGain = (weekGain ?? 0) + p.week_gain;
        weekStart += p.value - p.week_gain;
      }
      if (p.ytd_gain != null && p.ytd_start_value != null) {
        ytdGain = (ytdGain ?? 0) + p.ytd_gain;
        ytdStart += p.ytd_start_value;
      }
    });
    const perfKey = currentSort === 'week' ? 'week' : currentSort === 'ytd' ? 'ytd' : 'day';
    const [perfGain, perfStart] = perfKey === 'week' ? [weekGain, weekStart]
                                : perfKey === 'ytd'  ? [ytdGain,  ytdStart]
                                :                      [dayGain,  dayStart];
    const perfPct = (perfGain != null && perfStart) ? perfGain / perfStart * 100 : null;
    const perfLabel = perfKey === 'ytd' ? 'YTD' : perfKey === 'week' ? '1W' : '1D';

    document.getElementById('unvested-total').textContent = fmtFull(totalGross) + ' gross';
    const perfEl = document.getElementById('unvested-perf');
    if (perfGain != null) {
      const sign = perfGain >= 0 ? '+' : '';
      const cls  = perfGain >= 0 ? 'pos' : 'neg';
      const pctStr = perfPct != null ? ` (${sign}${perfPct.toFixed(1)}%)` : '';
      perfEl.innerHTML = `<span class="${cls}">${perfLabel} ${sign}${fmt(perfGain)}${pctStr}</span>`;
    } else {
      perfEl.innerHTML = `<span class="muted">~${fmtFull(totalGross * 0.7)} net est.</span>`;
    }

    const rowsEl = document.getElementById('unvested-rows');
    rowsEl.innerHTML = unvested.map(p => {
      const vestLabel = p.description.replace('Amazon RSU Vest ', '');
      const chips = [
        fmtGainChip(p.day_gain,  p.day_pct,  '1D'),
        fmtGainChip(p.week_gain, p.week_pct, '1W'),
        fmtGainChip(p.ytd_gain,  p.ytd_pct,  'YTD'),
      ].filter(Boolean).join('');
      return `
        <div class="unvested-row">
          <div class="pos-left">
            <div class="pos-ticker">${vestLabel}</div>
            <div class="pos-desc">${p.shares != null ? p.shares + ' gross units' : ''}</div>
            <div class="unvested-note">~${fmtFull(p.value * 0.7)} net after ~30% tax</div>
            ${chips ? `<div class="pos-gains">${chips}</div>` : ''}
          </div>
          <div class="pos-right">
            <div class="pos-value">${fmt(p.value)}</div>
            <div class="pos-source source-live">gross</div>
          </div>
        </div>`;
    }).join('');

    const totalNet = totalGross * 0.7;
    const totalRow = document.createElement('div');
    totalRow.className = 'unvested-total-row';
    totalRow.innerHTML = `
      <div class="pos-left">
        <div class="pos-ticker">Total</div>
        <div class="pos-desc">~70% net after tax</div>
      </div>
      <div class="pos-right">
        <div class="pos-value">${fmtFull(totalGross)}</div>
        <div class="pos-source muted">~${fmtFull(totalNet)} net</div>
      </div>`;
    rowsEl.appendChild(totalRow);

    section.style.display = '';
    if (unvestedCollapsed) section.classList.add('collapsed');
  }

  // ── Render baseline ───────────────────────────────────────────
  async function fetchBaseline() {
    try {
      const res  = await fetch('/api/baseline');
      const data = await res.json();
      if (!res.ok || data.error) return;
      document.getElementById('baseline-total').textContent = fmtFull(data.total);
      const ytdEl = document.getElementById('baseline-ytd');
      if (data.ytd_gain != null) {
        const sign = data.ytd_gain >= 0 ? '+' : '';
        const cls  = data.ytd_gain >= 0 ? 'pos' : 'neg';
        const pctStr = data.ytd_pct != null ? ` (${sign}${data.ytd_pct.toFixed(1)}%)` : '';
        ytdEl.innerHTML = `<span class="${cls}">${sign}${fmtFull(data.ytd_gain)}${pctStr}</span>`;
      } else {
        ytdEl.textContent = '—';
      }
      document.getElementById('baseline-card').style.display = '';
    } catch (_) {}
  }

  // ── Fetch portfolio ───────────────────────────────────────────
  async function fetchPortfolio() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    document.getElementById('error-msg').style.display = 'none';
    try {
      const res  = await fetch('/api/portfolio');
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
      allPositions = data.positions;
      renderUnvested(data.unvested_positions || []);
      const s = data.summary;
      document.getElementById('val-total').textContent  = fmtFull(s.total_portfolio);
      document.getElementById('val-liquid').textContent = 'Liquid: ' + fmtFull(s.liquid_total);
      fillPerfCell(document.getElementById('perf-day-val'),  document.getElementById('perf-day-pct'),  s.day_gain,  s.day_pct);
      fillPerfCell(document.getElementById('perf-week-val'), document.getElementById('perf-week-pct'), s.week_gain, s.week_pct);
      fillPerfCell(document.getElementById('perf-ytd-val'),  document.getElementById('perf-ytd-pct'),  s.ytd_gain,  s.ytd_pct);
      const timePart = (data.last_updated || '').split(' ')[1] || data.last_updated;
      document.getElementById('updated-label').textContent = 'Updated ' + timePart;
      document.getElementById('status-msg').style.display = 'none';
      renderGroups();
    } catch (err) {
      const el = document.getElementById('error-msg');
      el.textContent = 'Failed to load: ' + err.message;
      el.style.display = 'block';
      document.getElementById('status-msg').style.display = 'none';
      if (allPositions.length) renderGroups();
    } finally {
      btn.classList.remove('spinning');
      scheduleRefresh();
    }
  }

  // ── Render groups ─────────────────────────────────────────────
  function renderGroups() {
    let positions = combinedView ? combinePositions(allPositions) : allPositions;
    const groups = {};
    positions.forEach(p => {
      const key = p.asset_class || 'other';
      if (!groups[key]) groups[key] = [];
      groups[key].push(p);
    });

    const container = document.getElementById('groups-container');
    container.innerHTML = '';

    // Only render known groups — no "other" bucket
    GROUP_ORDER.forEach(key => {
      const rows = groups[key];
      if (!rows || rows.length === 0) return;

      const sorted     = sortRows(rows);
      const label      = GROUP_LABELS[key];
      const groupTotal = rows.reduce((s, p) => s + p.value, 0);
      const isCollapsed = collapsedGroups.has(key);

      const perfKey = currentSort === 'week' ? 'week' : currentSort === 'ytd' ? 'ytd' : 'day';
      let gStart = 0, gCur = 0, hasPerf = false;
      rows.forEach(p => {
        const startVal = perfKey === 'ytd'  ? p.ytd_start_value
                       : perfKey === 'week' ? (p.week_gain != null ? p.value - p.week_gain : null)
                       : (p.day_gain != null ? p.value - p.day_gain : null);
        if (startVal != null) { gStart += startVal; gCur += p.value; hasPerf = true; }
      });
      let perfHtml = '';
      if (hasPerf && gStart) {
        const gain = gCur - gStart;
        const pct  = gain / gStart * 100;
        const sign = gain >= 0 ? '+' : '';
        const cls  = gain >= 0 ? 'pos' : 'neg';
        const lbl  = perfKey === 'ytd' ? 'YTD' : perfKey === 'week' ? '1W' : '1D';
        perfHtml = `<div class="group-perf ${cls}">${lbl} ${sign}${pct.toFixed(1)}%</div>`;
      }

      const rowsHtml = sorted.map(p => {
        let detail = '';
        if (p.shares != null && p.price != null) detail = `${fmtShares(p.shares)} sh @ ${fmtPrice(p.price)}`;
        else if (p.shares != null)               detail = `${fmtShares(p.shares)} sh`;
        let accountsHtml = '';
        if (combinedView && p._count > 1) {
          const accts = p._accounts.map(a => a.replace(/_/g, ' ')).join(' · ');
          accountsHtml = `<div class="pos-accounts">${accts}</div>`;
        }
        const chips = [
          fmtGainChip(p.day_gain,     p.day_pct,     '1D'),
          fmtGainChip(p.week_gain,    p.week_pct,    '1W'),
          fmtGainChip(p.ytd_gain,     p.ytd_pct,     'YTD'),
          fmtGainChip(p.alltime_gain, p.alltime_pct, 'All-time'),
        ].filter(Boolean).join('');
        return `
          <div class="position-row">
            <div class="pos-left">
              <div class="pos-ticker">${p.ticker}</div>
              <div class="pos-desc">${p.description}</div>
              ${detail       ? `<div class="pos-detail">${detail}</div>` : ''}
              ${accountsHtml}
              ${chips        ? `<div class="pos-gains">${chips}</div>` : ''}
            </div>
            <div class="pos-right">
              <div class="pos-value">${fmt(p.value)}</div>
              <div class="pos-source ${srcClass(p.price_source)}">${srcLabel(p.price_source)}</div>
            </div>
          </div>`;
      }).join('');

      const groupEl = document.createElement('div');
      groupEl.className = 'group' + (isCollapsed ? ' collapsed' : '');
      groupEl.dataset.key = key;
      groupEl.innerHTML = `
        <div class="group-header">
          <span class="group-chevron">▼</span>
          <span class="group-name">${label}</span>
          <div class="group-meta">
            <div class="group-total">${fmtFull(groupTotal)}</div>
            ${perfHtml}
          </div>
        </div>
        <div class="group-rows">${rowsHtml}</div>`;
      groupEl.querySelector('.group-header').addEventListener('click', () => {
        const k = groupEl.dataset.key;
        collapsedGroups.has(k) ? collapsedGroups.delete(k) : collapsedGroups.add(k);
        groupEl.classList.toggle('collapsed');
      });
      container.appendChild(groupEl);
    });
  }

  // ── Actions page ──────────────────────────────────────────────
  async function loadActions() {
    if (actionsLoaded) return;
    try {
      const res  = await fetch('/api/actions');
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || 'Failed');
      document.getElementById('actions-loading').style.display = 'none';
      document.getElementById('actions-content').innerHTML = marked.parse(data.markdown);
      actionsLoaded = true;
    } catch (err) {
      document.getElementById('actions-loading').innerHTML =
        `<span style="color:var(--red)">Failed to load: ${err.message}</span>`;
    }
  }

  // ── Auto-refresh ──────────────────────────────────────────────
  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(fetchPortfolio, 5 * 60 * 1000);
  }

  // ── Nav page switching ────────────────────────────────────────
  function switchPage(name) {
    if (activePage === name) return;
    activePage = name;

    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    document.getElementById('page-' + name).classList.remove('hidden');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === name));

    const isPortfolio = name === 'portfolio';
    document.getElementById('refresh-btn').style.display = isPortfolio ? '' : 'none';
    document.getElementById('updated-label').style.display = isPortfolio ? '' : 'none';
    document.getElementById('page-title').style.display = isPortfolio ? 'none' : '';
    document.getElementById('page-title').textContent = 'Action Items';

    if (name === 'actions') loadActions();
  }

  // ── Events ────────────────────────────────────────────────────
  document.getElementById('refresh-btn').addEventListener('click', () => {
    clearTimeout(refreshTimer);
    fetchPortfolio();
  });

  document.getElementById('controls').addEventListener('click', e => {
    const btn = e.target.closest('.ctrl-btn');
    if (btn) {
      document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSort = btn.dataset.sort;
      renderGroups();
    }
  });

  document.getElementById('combine-btn').addEventListener('click', () => {
    combinedView = !combinedView;
    document.getElementById('combine-btn').classList.toggle('active', combinedView);
    renderGroups();
  });

  document.getElementById('unvested-header').addEventListener('click', () => {
    unvestedCollapsed = !unvestedCollapsed;
    document.getElementById('unvested-section').classList.toggle('collapsed', unvestedCollapsed);
  });

  document.getElementById('nav-bar').addEventListener('click', e => {
    const btn = e.target.closest('.nav-btn');
    if (btn) switchPage(btn.dataset.page);
  });

  // ── Boot ──────────────────────────────────────────────────────
  fetchPortfolio();
  fetchBaseline();
</script>
</body>
</html>
